name: cargo-checkct

on:
  pull_request:
    paths-ignore:
      - README.md
  push:
    branches:
      - master
    paths-ignore:
      - README.md

permissions:
  contents: read

jobs:
  checkct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: RustCrypto/cargo-checkct@main
        with:
          directory: .
          timeout: 120
          checks: control-flow,memory-access,dividend,divisor
